<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Scanner</title>
    <style>
*{ margin: 0; padding: 0; box-sizing: border-box; }
body {font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);min-height: 100vh;color: white;}
.header {background: rgba(255, 255, 255, 0.1);backdrop-filter: blur(20px);border-bottom: 1px solid rgba(255, 255, 255, 0.2);padding: 15px;display: flex;align-items: center;position: sticky;top: 0;z-index: 100;}
.container {padding: 20px;max-width: 400px;margin: 0 auto;width: 100%;}
.toggle-container {display: flex;background: rgba(0, 0, 0, 0.2);border-radius: 12px;padding: 5px;margin-bottom: 20px;}
.toggle-btn {flex: 1;padding: 12px;border: none;background: transparent;color: rgba(255, 255, 255, 0.6);border-radius: 8px;font-size: 1rem;font-weight: bold;cursor: pointer;transition: all 0.3s ease;}
.toggle-btn.active {background: rgba(255, 255, 255, 0.25);color: white;box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);}
.glass-panel {background: rgba(255, 255, 255, 0.15);backdrop-filter: blur(20px);border: 1px solid rgba(255, 255, 255, 0.2);border-radius: 15px;padding: 15px;margin-bottom: 20px;box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);}
.input-group { margin-bottom: 12px; }
.glass-input, .glass-select, .glass-textarea {width: 100%;padding: 12px;background: rgba(255, 255, 255, 0.1);border: 1px solid rgba(255, 255, 255, 0.3);border-radius: 8px;color: white;font-size: 1rem;outline: none;}
.glass-input::placeholder, .glass-textarea::placeholder { color: rgba(255, 255, 255, 0.6); }
.glass-select option { background: #764ba2; color: white; }
.glass-textarea { resize: vertical; min-height: 100px; font-family: inherit; }
.side-by-side { display: flex; gap: 8px; align-items: center; }
.side-by-side span { font-weight: bold; }
.checkbox-grid {display: grid;grid-template-columns: 1fr 1fr;gap: 12px;margin-bottom: 10px;}
.checkbox-label {display: flex;align-items: center;gap: 10px;font-size: 1rem;cursor: pointer;}
.checkbox-label input[type="checkbox"] {width: 20px;height: 20px;accent-color: #48bb78;}
.submit-btn {width: 100%;background: linear-gradient(135deg, rgba(72, 187, 120, 0.8), rgba(56, 178, 172, 0.8));border: 1px solid rgba(255, 255, 255, 0.4);border-radius: 12px;padding: 15px;color: white;font-size: 1.1rem;font-weight: bold;cursor: pointer;box-shadow: 0 4px 15px rgba(0,0,0,0.2);transition: transform 0.1s;}
.submit-btn:active { transform: translateY(2px); }
.submit-btn:disabled { background: rgba(255, 255, 255, 0.3); cursor: not-allowed; }
.photo-label {display: block; margin-bottom: 8px; font-weight: bold;color: #ffe66d;font-size: 1.1rem;}
    </style>
</head>
<body>
    <header class="header">
        <h1 id="pageTitle">Item Data Entry</h1>
    </header>
    <button onclick="window.location.href='prod_admin_user.html'" class="back-btn-custom" style="background: transparent; border: 2px solid #ffffff; border-radius: 8px; padding: 6px 12px; color: #ffffff; font-size: 16px; font-weight: bold; cursor: pointer; margin: 0 0 15px 20px; display: flex; align-items: center; gap: 8px; width: fit-content;">
        <i class="fas fa-arrow-left"></i> <span data-translate="back">Back</span>
    </button>
    
    <div class="container">
        
        <div class="toggle-container">
            <button type="button" id="btnScan" class="toggle-btn active" onclick="switchMode('scan')">📷 Scan</button>
            <button type="button" id="btnRemark" class="toggle-btn" onclick="switchMode('remark')">📝 Remark</button>
        </div>

        <form id="scannerForm">

            <div class="glass-panel" style="padding-bottom: 5px;">
                <div class="input-group">
                    <input type="text" id="picName" class="glass-input" placeholder="PIC Name" required>
                </div>
            </div>

            <div id="scanView">
                <div class="glass-panel">
                    <div class="input-group">
                        <select id="lineName" class="glass-select" required>
                            <option value="" disabled selected>Select Line Name</option>
                            <option value="R/F 1-1">R/F 1-1</option>
                            <option value="R/F 1-2">R/F 1-2</option>
                            <option value="R/F 1-3">R/F 1-3</option>
                            <option value="R/F 1-4">R/F 1-4</option>
                            <option value="R/F 1-5">R/F 1-5</option>
                            <option value="R/F 1-6">R/F 1-6</option>
                            <option value="R/F 1-7">R/F 1-7</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <input type="text" id="sebangou" class="glass-input" placeholder="Sebangou" required>
                    </div>

                    <div class="spec-group input-group side-by-side">
                        <select id="materialspec" class="glass-select" style="flex: 2; min-width: 0;" required>
                            <option id="optMaterial" value="" disabled selected>Material Spec</option>
                            <option value="SPH">SPH</option>
                            <option value="SPC">SPC</option>
                            <option value="SCGA">SCGA</option>
                            <option value="SHGA">SHGA</option>
                            <option value="SPHC">SPHC</option>
                            <option value="SPCC">SPCC</option> 
                        </select>
                        <input type="text" id="materialSpecDetails" class="glass-input" placeholder="Spec Details" style="flex: 1.5; min-width: 0;" required>
                    </div>
                    
                    <div class="input-group side-by-side" >
                        <input type="number" id="size1" class="glass-input" placeholder="Thickness" step="any" style="flex: 1.5; min-width: 0; padding: 12px 5px; text-align: center;" required>
                        <span>x</span>
                        <input type="number" id="size2" class="glass-input" placeholder="Length" step="any" style="flex: 1.2; min-width: 0; padding: 12px 5px; text-align: center;" required>
                        <span>x</span>
                        <select id="sizeType" class="glass-select" style="flex: 1.5; min-width: 0; padding: 12px 2px; text-align: center; cursor: pointer;" required>
                            <option value="C">Coil</option>
                            <option value="L">Length</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <input type="number" id="pitch" class="glass-input" placeholder="Pitch" step="any" required>
                    </div>
                </div>

                <div class="glass-panel" style="background: rgba(0,0,0,0.3); border-color: #ffe66d;">
                    <label for="photoFile" class="photo-label">📸 Snap Sticker Photo Proof</label>
                    <input type="file" id="photoFile" accept="image/*" capture="environment" required style="color: white; width: 100%; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 8px;">
                </div>
            </div>

            <div id="remarkView" style="display: none;">
                <div class="glass-panel">
                    <label style="display: block; margin-bottom: 12px; font-weight: bold; color: #ffe66d;">Select Affected Line(s):</label>
                    <div class="checkbox-grid">
                        <label class="checkbox-label"><input type="checkbox" name="remarkLine" value="R/F 1-1"> R/F 1-1</label>
                        <label class="checkbox-label"><input type="checkbox" name="remarkLine" value="R/F 1-2"> R/F 1-2</label>
                        <label class="checkbox-label"><input type="checkbox" name="remarkLine" value="R/F 1-3"> R/F 1-3</label>
                        <label class="checkbox-label"><input type="checkbox" name="remarkLine" value="R/F 1-4"> R/F 1-4</label>
                        <label class="checkbox-label"><input type="checkbox" name="remarkLine" value="R/F 1-5"> R/F 1-5</label>
                        <label class="checkbox-label"><input type="checkbox" name="remarkLine" value="R/F 1-6"> R/F 1-6</label>
                        <label class="checkbox-label"><input type="checkbox" name="remarkLine" value="R/F 1-7"> R/F 1-7</label>
                    </div>
                </div>

                <div class="glass-panel">
                    <label style="display: block; margin-bottom: 8px; font-weight: bold;">Reason for Remark:</label>
                    <textarea id="remarkReason" class="glass-textarea" placeholder="E.g., Machine breakdown, waiting for material..." required disabled></textarea>
                </div>
            </div>

            <button type="button" id="saveBtn" class="submit-btn" onclick="processAndSend()">
                💾 Save to Google Sheets
            </button>

        </form>
    </div>

    <script>
    const GOOGLE_URL = "https://script.google.com/macros/s/AKfycbwrjJENFvrD1VchToVQPPrC7G7Rjs9zNphoPICOW5DSq4dGaGbIQLFuIWtCrl_X50-7qA/exec"; 
    let currentMode = 'scan'; 

    window.onload = function() {
        let savedName = localStorage.getItem("loggedInPIC");
        let picInput = document.getElementById("picName");
        
        if (savedName) {
            picInput.value = savedName;
            picInput.readOnly = true; 
            picInput.style.backgroundColor = "rgba(0, 0, 0, 0.2)"; 
            picInput.style.color = "#ccc";
        }
    };

    function switchMode(mode) {
        currentMode = mode;
        
        document.getElementById('btnScan').classList.toggle('active', mode === 'scan');
        document.getElementById('btnRemark').classList.toggle('active', mode === 'remark');
        document.getElementById('pageTitle').innerText = mode === 'scan' ? 'Item Data Entry' : 'Line Remark Entry';

        const scanView = document.getElementById('scanView');
        const remarkView = document.getElementById('remarkView');

        if (mode === 'scan') {
            scanView.style.display = 'block';
            remarkView.style.display = 'none';
            scanView.querySelectorAll('input, select').forEach(el => el.disabled = false);
            remarkView.querySelectorAll('input, textarea').forEach(el => el.disabled = true);
        } else {
            scanView.style.display = 'none';
            remarkView.style.display = 'block';
            scanView.querySelectorAll('input, select').forEach(el => el.disabled = true);
            remarkView.querySelectorAll('input, textarea').forEach(el => el.disabled = false);
        }
    }

    function processAndSend() {
        let form = document.getElementById("scannerForm");
        
        if (!form.reportValidity()) {
            return; 
        }

        if (currentMode === 'remark') {
            let checkboxes = document.querySelectorAll('input[name="remarkLine"]:checked');
            if (checkboxes.length === 0) {
                alert("Please select at least one Line for this remark!");
                return;
            }
        }

        let btn = document.getElementById("saveBtn");
        btn.innerText = "⏳ Uploading...";
        btn.disabled = true;

        if (currentMode === 'scan') {
            let fileInput = document.getElementById("photoFile");
            let file = fileInput.files[0];

            if (file) {
                let img = new Image();
                let reader = new FileReader();
                reader.onloadend = function() {
                    img.src = reader.result;
                    img.onload = function() {
                        let canvas = document.createElement("canvas");
                        let maxSize = 500; 
                        let scale = Math.min(maxSize / img.width, maxSize / img.height, 1);
                        canvas.width = img.width * scale;
                        canvas.height = img.height * scale;
                        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
                        let compressed = canvas.toDataURL("image/jpeg", 0.5).split(',')[1]; 
                        
                        let thickness = document.getElementById("size1").value;
                        let length = document.getElementById("size2").value;
                        let sizeType = document.getElementById("sizeType").value;
                        let specBase = document.getElementById("materialspec").value;
                        let specDetails = document.getElementById("materialSpecDetails").value;
                        
                        let payload = {
                            lineName: document.getElementById("lineName").value,
                            picName: document.getElementById("picName").value,
                            sebangou: document.getElementById("sebangou").value, 
                            materialSpec: `${specBase} - ${specDetails}`,
                            materialThickness: thickness, 
                            materialSize: `${thickness} x ${length} x ${sizeType}`, 
                            pitch: document.getElementById("pitch").value,
                            image: compressed,
                            mimeType: "image/jpeg",
                            fileName: file.name
                        };
                        
                        executeFetch(payload);
                    };
                };
                reader.readAsDataURL(file);
            } else {
                alert("Please attach a photo!");
                resetFormState();
            }

        } else {
            let checkboxes = document.querySelectorAll('input[name="remarkLine"]:checked');
            let selectedLines = Array.from(checkboxes).map(cb => cb.value).join(', ');
            let reasonText = document.getElementById("remarkReason").value;

            let payload = {
                lineName: selectedLines,
                picName: document.getElementById("picName").value,
                sebangou: "REMARK",                  
                materialSpec: reasonText,            
                materialThickness: "-",
                materialSize: "-",
                pitch: "-",
                image: "",                           
                mimeType: "",
                fileName: ""
            };

            executeFetch(payload);
        }
    }

    // ========================================================
    // FIX: Using URLSearchParams & mode: 'no-cors' for Live Sync
    // ========================================================
    function executeFetch(payload) {
        // Convert the JSON payload into a Form Data object
        const formData = new URLSearchParams();
        for (const key in payload) {
            formData.append(key, payload[key]);
        }

        // Send with no-cors to bypass browser security stops
        fetch(GOOGLE_URL, { 
            method: "POST", 
            mode: "no-cors",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: formData 
        })
        .then(() => {
            // Note: Because of 'no-cors', the response is opaque. 
            // We assume success if the fetch command finishes without a network error.
            alert("Success: Data sent to Google Sheets!");
            resetFormState();
            
            // Clear remark specific fields manually
            document.querySelectorAll('input[name="remarkLine"]').forEach(cb => cb.checked = false);
            document.getElementById("remarkReason").value = "";
        })
        .catch(error => {
            console.error("Error:", error);
            alert("Error saving data. Check connection.");
            resetFormState();
        });
    }

    function resetFormState() {
        const form = document.getElementById('scannerForm');
        const picNameInput = document.getElementById('picName');
        const savedPicName = picNameInput.value;

        form.reset();
        picNameInput.value = savedPicName; 

        document.getElementById("lineName").value = "";
        document.getElementById("sebangou").value = "";
        document.getElementById("materialspec").value = ""; 
        document.getElementById("size1").value = ""; 
        document.getElementById("size2").value = ""; 
        document.getElementById("sizeType").value = "C"; 
        document.getElementById("pitch").value = "";
        document.getElementById("photoFile").value = "";
        
        let btn = document.getElementById("saveBtn");
        btn.innerText = "💾 Save to Google Sheets";
        btn.disabled = false;
    }
    </script>
</body>
</html>
