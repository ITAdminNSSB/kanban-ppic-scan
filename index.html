<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kanban QR Scan</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F6F8FA;--surface:#FFFFFF;--border:#D0D7DE;--text:#1F2328;
  --muted:#656D76;--accent:#0969DA;--green:#1A7F37;--red:#CF222E;--radius:10px;
}
html,body{height:100vh;height:100dvh;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow:hidden}

/* NAV */
#nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--surface);border-top:1px solid var(--border);z-index:100;height:calc(60px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;color:var(--muted);font-family:'Inter',sans-serif;font-size:11px;cursor:pointer;transition:color .15s}
.nav-btn.active{color:var(--accent)}
.nav-btn svg{width:22px;height:22px;stroke-width:1.8}
.screen{display:none;position:fixed;top:0;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));overflow-y:auto}
.screen.active{display:flex;flex-direction:column}

/* LOGIN / ID SCREEN - Enforced Front Page */
#login-screen{display:flex;position:fixed;inset:0;background:var(--bg);z-index:300;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
#login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px 24px;width:100%;max-width:360px;text-align:center;box-shadow:0 12px 24px rgba(0,0,0,0.05);}
.login-title{font-size:20px;font-weight:700;margin-bottom:8px;}
.login-sub{font-size:13px;color:var(--muted);margin-bottom:24px;}
.login-inp{width:100%;background:var(--bg);border:2px solid var(--border);border-radius:10px;padding:14px;font-family:'JetBrains Mono',monospace;font-size:16px;text-align:center;outline:none;margin-bottom:16px;transition:border-color .2s;}
.login-inp:focus{border-color:var(--accent);}
.login-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;}
.login-btn:active{opacity:0.9;}

/* OPERATOR BAR */
#op-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;}
#op-bar-label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:0.5px;text-transform:uppercase;}
#op-bar-id{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:var(--accent);margin-left:6px;}
#op-bar-change{font-size:12px;color:var(--accent);font-weight:500;cursor:pointer;background:none;border:none;padding:4px;}

/* SCAN SCREEN */
#scan-screen{background:var(--bg);overflow-x:hidden;}
#scan-main{flex:1;display:flex;flex-direction:column;padding:12px;gap:8px;max-width:480px;margin:0 auto;width:100%;}

/* scan icon */
#scan-icon-wrap{
  border-radius:12px;background:var(--surface);border:2px dashed var(--border);
  display:flex;flex-direction:row;align-items:center;justify-content:center;gap:14px;
  transition:all .2s;position:relative;overflow:hidden;padding:16px;
}
#scan-icon-wrap.active{border-color:var(--accent);border-style:solid;background:#EBF3FF}
#scan-icon-wrap svg{width:32px;height:32px;color:var(--border);transition:color .2s;flex-shrink:0}
#scan-icon-wrap.active svg{color:var(--accent)}
#scan-ready-text{font-size:14px;color:var(--muted);font-weight:600;text-align:left;line-height:1.4}
#scan-icon-wrap.active #scan-ready-text{color:var(--accent)}
#scan-icon-wrap.active::before{
  content:'';position:absolute;inset:-2px;border-radius:14px;
  border:3px solid var(--accent);opacity:0;
  animation:ring 1.5s ease-out infinite;
}

/* MANUAL INPUT WRAP */
.manual-wrap { display:flex; gap:8px; margin-bottom: 8px; }
.manual-inp { flex:1; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:12px 14px; font-family:'JetBrains Mono',monospace; font-size:14px; outline:none; transition:border-color .2s; }
.manual-inp:focus { border-color:var(--accent); }
.manual-btn { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:0 20px; font-size:14px; font-weight:600; cursor:pointer; }
.manual-btn:active { opacity:0.9; }

/* GROUPED LIST STYLES */
.list-header{display:flex;align-items:center;justify-content:space-between;padding:12px 4px 4px;}
.list-title{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.list-total{font-size:12px;font-weight:700;color:var(--accent)}

.group-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.group-head{padding:10px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;background:var(--surface);}
.group-badge{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.group-name{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;flex:1;word-break:break-all;line-height:1.3;}
.group-count{background:#EBF3FF;color:var(--accent);border-radius:12px;padding:2px 8px;font-size:11px;font-weight:600}
.group-rows{border-top:1px solid var(--border)}
.scan-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);background:#FAFAFA;}
.scan-row:last-child{border-bottom:none}
.scan-row.voided{opacity:.4}
.scan-row-left{display:flex;flex-direction:column;gap:4px;}
.scan-row-model{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px; color:var(--text); word-break:break-all;}
.scan-row-meta{display:flex; gap:10px; align-items:center;}
.scan-row-time{font-size:11px;font-weight:600;color:var(--muted);font-family:'JetBrains Mono',monospace;}
.scan-row-op{font-size:10px;color:var(--muted);font-weight:500;}
.void-btn{background:none;border:1px solid var(--border);border-radius:6px;color:var(--muted);font-size:10px;padding:4px 8px;cursor:pointer;font-weight:600;}
.void-btn:hover{border-color:var(--red);color:var(--red)}
.void-label{font-size:10px;color:var(--red);font-family:'JetBrains Mono',monospace;font-weight:600;}

/* hidden scanner input */
#scanner-input{position:absolute;opacity:0;width:1px;height:1px;top:-999px;}

/* flash overlay */
#flash{
  position:fixed;inset:0;bottom:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(255,255,255,.97);opacity:0;pointer-events:none;transition:opacity .15s;z-index:50;gap:6px;
}
#flash.show{opacity:1}
#flash-model{font-family:'JetBrains Mono',monospace;font-size:32px;font-weight:700;color:var(--accent);text-align:center;padding:0 24px;line-height:1.2;word-break:break-all}
#flash-ok{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:15px;font-weight:600;color:var(--green)}
#flash-ok svg{width:24px;height:24px}

/* TODAY SCREEN */
#today-screen{background:var(--bg)}
.today-header{padding:16px 16px 10px;border-bottom:1px solid var(--border);background:var(--surface)}
.today-title{font-size:18px;font-weight:600}
.today-sub{font-size:12px;color:var(--muted);margin-top:4px}
.today-body{padding:12px;max-width:480px;margin:0 auto;width:100%;}
#empty-state{text-align:center;color:var(--muted);font-size:14px;padding:48px 24px}
#empty-state svg{width:40px;height:40px;opacity:.25;display:block;margin:0 auto 12px}

/* SETTINGS SCREEN */
#settings-screen{background:var(--bg)}
.settings-wrap{padding:16px;max-width:600px;margin:0 auto}
.s-section{margin-bottom:24px}
.s-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px}
.s-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.s-label{font-size:13px;color:var(--text);margin-bottom:6px;display:block}
.s-input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:12px;padding:9px 12px;outline:none;margin-bottom:10px}
.s-input:focus{border-color:var(--accent)}
.s-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 18px;font-weight:600;font-size:13px;cursor:pointer;margin-right:8px}
.s-btn.danger{background:var(--red)}
.s-hint{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.6}
.sync-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--border)}
.sync-dot.ok{background:var(--green)}
.sync-dot.err{background:var(--red)}
.sync-dot.pulse{animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.sync-label{font-size:12px;color:var(--muted)}

/* toast */
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#1F2328;border:1px solid #444;border-radius:8px;padding:10px 18px;font-size:13px;color:#fff;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid #D0D7DE;background:transparent;transition:background .15s}
.pin-dot.filled{background:#0969DA;border-color:#0969DA}
.pin-key{background:#F6F8FA;border:1px solid #D0D7DE;border-radius:10px;font-size:18px;font-weight:500;padding:14px;cursor:pointer;font-family:Inter,sans-serif;color:#1F2328;transition:background .1s}
.pin-key:active{background:#E0E7EF}
.pin-clear{font-size:16px}
.pin-cancel{font-size:16px;color:#CF222E;border-color:#FFCDD2}
#pin-modal.open{display:flex!important}
</style>
</head>
<body>

<!-- LOGIN / ID SCREEN -->
<div id="login-screen">
  <div id="login-card">
    <div class="login-title">Operator Login</div>
    <div class="login-sub">Please enter your ID number to begin</div>
    <input type="text" id="op-id-login" class="login-inp" placeholder="Scan or type ID..." autocomplete="off">
    <button class="login-btn" onclick="submitLogin()">Start Scanning</button>
  </div>
</div>

<!-- SCAN SCREEN -->
<div id="scan-screen" class="screen">
  <input id="scanner-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

  <div id="op-bar">
    <div id="op-bar-label">Operator: <span id="op-bar-id">---</span></div>
    <button id="op-bar-change" onclick="logout()">Change ID</button>
  </div>

  <div id="scan-main">
    <div id="scan-icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2"/>
        <rect x="7" y="7" width="4" height="4" rx="1"/>
        <rect x="13" y="7" width="4" height="4" rx="1"/>
        <rect x="7" y="13" width="4" height="4" rx="1"/>
      </svg>
      <div id="scan-ready-text">Scanner Active<br><span style="font-size:12px;font-weight:400">Point at kanban QR</span></div>
    </div>
    
    <!-- MANUAL INPUT SECTION -->
    <div class="manual-wrap">
      <input type="text" id="manual-input" class="manual-inp" placeholder="Manual Entry..." autocomplete="off">
      <button class="manual-btn" onclick="submitManual()">Add</button>
    </div>

    <div class="list-header">
      <span class="list-title">Scanned Models</span>
      <span class="list-total" id="scan-total">0 scans</span>
    </div>
    <div id="scan-groups-container">
      <!-- Grouped items injected here -->
    </div>
  </div>

  <div id="flash">
    <div id="flash-model">—</div>
    <div id="flash-ok">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      Logged
    </div>
  </div>
</div>

<!-- TODAY SCREEN -->
<div id="today-screen" class="screen">
  <div class="today-header">
    <div class="today-title">Today's History</div>
    <div class="today-sub" id="today-sub">Loading…</div>
  </div>
  <div class="today-body" id="today-body">
    <!-- Same grouped items injected here -->
  </div>
</div>

<!-- SETTINGS SCREEN -->
<div id="settings-screen" class="screen">
  <div class="settings-wrap">
    <div class="s-section">
      <div class="s-title">Google Sheets Sync</div>
      <div class="s-card">
        <label class="s-label">Apps Script Web App URL</label>
        <input class="s-input" id="gs-url" type="url" placeholder="https://script.google.com/macros/s/…/exec">
        <button class="s-btn" onclick="saveGsUrl()">Save URL</button>
        <div class="sync-row">
          <div class="sync-dot" id="sync-dot"></div>
          <div class="sync-label" id="sync-label">Not configured</div>
        </div>
      </div>
    </div>
    <div class="s-section">
      <div class="s-title">Data Management</div>
      <div class="s-card">
        <div class="s-label">Local storage</div>
        <div class="s-hint" style="margin-bottom:10px" id="data-count">—</div>
        <button class="s-btn danger" onclick="clearData()">Clear local data</button>
      </div>
    </div>
  </div>
</div>

<!-- EXPLICIT BOTTOM NAV MENU WITH SETTINGS VISIBLE -->
<nav id="nav" style="display:none;">
  <button class="nav-btn active" id="nav-scan" onclick="showScreen('scan')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="3" width="6" height="6" rx="1"/><rect x="3" y="15" width="6" height="6" rx="1"/><path d="M15 15h2v2h-2zM19 15h2v2h-2zM15 19h2v2h-2zM19 19h2v2h-2z"/></svg>
    Scan
  </button>
  <button class="nav-btn" id="nav-today" onclick="showScreen('today')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    Today
  </button>
  <button class="nav-btn" id="nav-settings-btn" onclick="openPinModal()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"></path>
    </svg>
    Settings
  </button>
</nav>

<!-- PIN MODAL -->
<div id="pin-modal" style="display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.45);align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:16px;padding:28px 24px;width:300px;box-shadow:0 8px 32px rgba(0,0,0,.18);text-align:center;">
    <div style="font-size:15px;font-weight:600;color:#1F2328;margin-bottom:4px;">Admin Access</div>
    <div style="font-size:12px;color:#656D76;margin-bottom:20px;">Enter PIN to open Settings</div>
    <div id="pin-dots" style="display:flex;gap:10px;justify-content:center;margin-bottom:20px;">
      <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;">
      <button class="pin-key" onclick="pinKey('1')">1</button>
      <button class="pin-key" onclick="pinKey('2')">2</button>
      <button class="pin-key" onclick="pinKey('3')">3</button>
      <button class="pin-key" onclick="pinKey('4')">4</button>
      <button class="pin-key" onclick="pinKey('5')">5</button>
      <button class="pin-key" onclick="pinKey('6')">6</button>
      <button class="pin-key" onclick="pinKey('7')">7</button>
      <button class="pin-key" onclick="pinKey('8')">8</button>
      <button class="pin-key" onclick="pinKey('9')">9</button>
      <button class="pin-key pin-clear" onclick="pinClear()">⌫</button>
      <button class="pin-key" onclick="pinKey('0')">0</button>
      <button class="pin-key pin-cancel" onclick="closePinModal()">✕</button>
    </div>
    <div id="pin-error" style="font-size:12px;color:#CF222E;min-height:16px;"></div>
  </div>
</div>

<div id="toast"></div>

<script>
const MODEL_COLORS=['#0969DA','#1A7F37','#9A3412','#92400E','#6D28D9','#0E7490','#BE185D','#B45309'];
let S={scans:[],gsUrl:'',modelColors:{},colorIdx:0,operatorId:''};

function save(){localStorage.setItem('kanban_s',JSON.stringify(S));}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem('kanban_s')||'{}');
    S.scans=d.scans||[];S.gsUrl=d.gsUrl||'';S.modelColors=d.modelColors||{};S.colorIdx=d.colorIdx||0;S.operatorId=d.operatorId||'';
    document.getElementById('gs-url').value=S.gsUrl;
    updateSyncStatus('');
  }catch(e){}
}
function colorFor(prefix){
  if(!S.modelColors[prefix]){S.modelColors[prefix]=MODEL_COLORS[S.colorIdx%MODEL_COLORS.length];S.colorIdx++;save();}
  return S.modelColors[prefix];
}
function todayStr(){
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0,10);
}
function timeStr(){
  const d = new Date();
  return d.toTimeString().slice(0,8);
}
function todayScans(){return S.scans.filter(s=>s.date===todayStr());}

function checkLogin() {
  if (!S.operatorId) {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('nav').style.display = 'none';
    document.getElementById('op-id-login').focus();
  } else {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('nav').style.display = 'flex';
    document.getElementById('op-bar-id').textContent = S.operatorId;
    showScreen('scan');
  }
}

function submitLogin() {
  const val = document.getElementById('op-id-login').value.trim();
  if (!val) { toast('Please enter an ID'); return; }
  S.operatorId = val;
  save();
  document.getElementById('op-id-login').value = '';
  checkLogin();
  toast('ID Locked. Ready to scan.');
}

document.getElementById('op-id-login').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') submitLogin();
});

function logout() {
  S.operatorId = '';
  save();
  checkLogin();
}

let scanBuffer='';
let scanTimer=null;

document.addEventListener('keydown', e => {
  const tag = document.activeElement.tagName;
  const id  = document.activeElement.id;
  
  // Allow typing in specific inputs like manual-input, ID login, and google sheets URL
  if ((tag==='INPUT'||tag==='TEXTAREA') && id!=='scanner-input' && id!=='op-id-login' && id!=='manual-input' && id!=='gs-url') return;

  if (e.key==='Enter' && id !== 'manual-input') {
    clearTimeout(scanTimer);
    const val = scanBuffer;
    scanBuffer = '';
    if (val.trim().length > 0 && S.operatorId) handleScan(val);
    return;
  }

  if (e.key.length === 1 && id !== 'manual-input' && id !== 'op-id-login' && id !== 'gs-url') {
    scanBuffer += e.key;
    clearTimeout(scanTimer);
    scanTimer = setTimeout(() => { scanBuffer = ''; }, 300);
  }
});

// Manual Submission Logic
function submitManual() {
  const val = document.getElementById('manual-input').value.trim();
  if (val && S.operatorId) {
    handleScan(val);
    document.getElementById('manual-input').value = '';
    keepFocus();
  } else if (!val) {
    toast('Please enter a value');
  }
}

document.getElementById('manual-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') submitManual();
});

const scannerInput = document.getElementById('scanner-input');
function keepFocus(){
  if (!S.operatorId) return;
  const id = document.activeElement.id;
  // Let the user click and type into manual input or settings safely
  if(id!=='gs-url' && id!=='scanner-input' && id!=='manual-input' && id!=='op-id-login'){
    scannerInput.focus();
  }
}
document.addEventListener('click', ()=>setTimeout(keepFocus,50));
document.addEventListener('touchend', ()=>setTimeout(keepFocus,50));

let flashTimeout;
let lastScanId='';

function handleScan(raw){
  if(raw===lastScanId && flashTimeout) return;
  lastScanId=raw;

  const model = raw.replace(/[\r\n\t]+/g, '').trim().toUpperCase();
  if(!model) return;
  
  const entry={
    scanId:'SC-'+Date.now(),
    operatorId: S.operatorId,
    model: model,
    date: todayStr(),
    time: timeStr(),
    status:'OK'
  };
  S.scans.push(entry);save();
  renderGroupedLists();
  postToSheet(entry);

  document.getElementById('flash-model').textContent=model;
  document.getElementById('flash').classList.add('show');
  document.getElementById('scan-icon-wrap').classList.add('active');

  clearTimeout(flashTimeout);
  flashTimeout=setTimeout(()=>{
    document.getElementById('flash').classList.remove('show');
    document.getElementById('scan-icon-wrap').classList.remove('active');
    lastScanId='';
  },1200);
}

function renderGroupedLists(){
  const today = todayScans();
  const active = today.filter(s => s.status !== 'VOID');
  const voided = today.filter(s => s.status === 'VOID');
  
  document.getElementById('scan-total').textContent = `${active.length} scan${active.length!==1?'s':''}`;
  document.getElementById('today-sub').textContent = `${new Date().toLocaleDateString('en-MY',{weekday:'long',day:'numeric',month:'short'})}  ·  ${active.length} scans${voided.length?'  ·  '+voided.length+' voided':''}`;

  const containerScan = document.getElementById('scan-groups-container');
  const containerToday = document.getElementById('today-body');

  if (today.length === 0) {
    const emptyHtml = `<div id="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h.01M15 9h.01M9 15h6"/></svg>No scans recorded today</div>`;
    containerScan.innerHTML = emptyHtml;
    containerToday.innerHTML = emptyHtml;
    return;
  }

  // Group by the first 4 characters of the model
  const groups = {};
  today.forEach(s => {
    // If the model string is less than 4 chars, we group by the whole model string
    const prefix = s.model.length >= 4 ? s.model.substring(0, 4).toUpperCase() : s.model.toUpperCase();
    if(!groups[prefix]) groups[prefix] = [];
    groups[prefix].push(s);
  });

  const sortedPrefixes = Object.keys(groups).sort((a, b) => a.localeCompare(b));

  const html = sortedPrefixes.map(prefix => {
    const rows = groups[prefix];
    const col = colorFor(prefix);
    const activeCount = rows.filter(r => r.status !== 'VOID').length;
    
    rows.sort((a,b) => b.time.localeCompare(a.time));

    const rowsHtml = rows.map(r => `
      <div class="scan-row ${r.status==='VOID'?'voided':''}">
        <div class="scan-row-left">
          <span class="scan-row-model">${r.model}</span>
          <div class="scan-row-meta">
            <span class="scan-row-time">${r.time}</span>
            <span class="scan-row-op">OP: ${r.operatorId}</span>
          </div>
        </div>
        ${r.status==='VOID' ? 
          '<span class="void-label">VOID</span>' : 
          `<button class="void-btn" onclick="voidScan('${r.scanId}')">VOID</button>`}
      </div>
    `).join('');

    return `
      <div class="group-card">
        <div class="group-head">
          <div class="group-badge" style="background:${col}"></div>
          <div class="group-name" style="color:${col}">Category: ${prefix}</div>
          <span class="group-count">${activeCount}</span>
        </div>
        <div class="group-rows">${rowsHtml}</div>
      </div>
    `;
  }).join('');

  containerScan.innerHTML = html;
  containerToday.innerHTML = html;
}

function voidScan(id){
  const entry=S.scans.find(s=>s.scanId===id);
  if(!entry)return;
  entry.status='VOID';save();
  renderGroupedLists();
  postToSheet({...entry,status:'VOID'});
  toast('Scan voided');
}

async function postToSheet(entry){
  if(!S.gsUrl)return;
  try{
    const url = S.gsUrl + '?data=' + encodeURIComponent(JSON.stringify(entry));
    await fetch(url, {method:'GET', mode:'no-cors'});
    updateSyncStatus('ok');
  }catch(e){updateSyncStatus('err');}
}
function saveGsUrl(){S.gsUrl=document.getElementById('gs-url').value.trim();save();updateSyncStatus('');toast('URL saved');}
function updateSyncStatus(state){
  const dot=document.getElementById('sync-dot'),lbl=document.getElementById('sync-label');
  if(!S.gsUrl){dot.className='sync-dot';lbl.textContent='Not configured';return;}
  if(state==='ok'){dot.className='sync-dot ok';lbl.textContent='Connected';return;}
  if(state==='err'){dot.className='sync-dot err';lbl.textContent='Sync failed — check URL';return;}
  dot.className='sync-dot ok pulse';lbl.textContent='URL saved — will sync on next scan';
}
function clearData(){
  if(!confirm('Clear all local scan data?'))return;
  S.scans=[];save();renderGroupedLists();
  document.getElementById('data-count').textContent='0 scans stored locally';
  toast('Data cleared');
}

function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  
  const scr=document.getElementById(name+'-screen');
  let btnId = 'nav-' + name;
  if(name === 'settings') btnId = 'nav-settings-btn';
  const btn = document.getElementById(btnId);
  
  if(scr)scr.classList.add('active');
  if(btn)btn.classList.add('active');
  if(name==='settings')document.getElementById('data-count').textContent=S.scans.length+' scans stored locally';
  if(name==='scan')setTimeout(()=>keepFocus(),100);
}

let toastT;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2200);}

const ADMIN_PIN = '1234'; 
let pinBuffer = '';

function openPinModal() {
  pinBuffer = ''; updatePinDots();
  document.getElementById('pin-error').textContent = '';
  document.getElementById('pin-modal').classList.add('open');
}
function closePinModal() {
  document.getElementById('pin-modal').classList.remove('open');
}
function pinKey(k) {
  if (pinBuffer.length >= 4) return;
  pinBuffer += k; updatePinDots();
  if (pinBuffer.length === 4) setTimeout(() => checkPin(), 150);
}
function pinClear() {
  pinBuffer = pinBuffer.slice(0, -1); updatePinDots();
  document.getElementById('pin-error').textContent = '';
}
function updatePinDots() {
  document.querySelectorAll('.pin-dot').forEach((d, i) => {
    d.classList.toggle('filled', i < pinBuffer.length);
  });
}
function checkPin() {
  if (pinBuffer === ADMIN_PIN) {
    closePinModal(); showScreen('settings');
  } else {
    document.getElementById('pin-error').textContent = 'Incorrect PIN';
    pinBuffer = ''; updatePinDots();
  }
}

load();
renderGroupedLists();
checkLogin();
</script>
